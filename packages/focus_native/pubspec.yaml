name: focus_native
description: "Focus Reset native iOS bridge: local notifications, Apple Calendar (read-only) and time zone."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FocusNativePlugin
